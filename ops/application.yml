spring:
  datasource:
    url: jdbc:mysql://mysql:3306/train_controller
    username: ${DB_USER:train}
    password: ${DB_PASSWORD:train}

interceptor:
  settle-delay-ms: ${SETTLE_DELAY_MS:750}
  max-retries: ${MAX_RETRIES:5}
  retry-backoff-ms: ${RETRY_BACKOFF_MS:500}
  serial-port: ${SERIAL_PORT:/dev/ttyRS485}
  serial-baud: ${SERIAL_BAUD:19200}
  turnout-node-id: ${TURNOUT_NODE_ID:turnout1}
  mqtt:
    broker-uri: ${MQTT_BROKER_URI:tcp://mosquitto:1883}
    client-id: ${MQTT_CLIENT_ID:train-interceptor-1}
    inbound-topic: ${MQTT_INBOUND_TOPIC:trains/track/turnout/+}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      service: interceptor-java
