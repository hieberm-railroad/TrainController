spring:
  datasource:
    url: jdbc:mysql://localhost:3306/train_controller
    username: train
    password: train

interceptor:
  settle-delay-ms: 750
  max-retries: 5
  retry-backoff-ms: 500
  serial-port: ${SERIAL_PORT:/dev/ttyRS485}
  serial-baud: 19200
  turnout-node-id: turnout1
  mqtt:
    broker-uri: tcp://localhost:1883
    client-id: train-interceptor-1
    inbound-topic: trains/track/turnout/+

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      service: interceptor-java
